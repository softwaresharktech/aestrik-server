; extensions_custom.conf
;
; Deployed automatically by .github/workflows/deploy-asterisk-config.yml on every push to
; main. Do NOT edit this file directly on the server — changes will be overwritten on the
; next deploy. Edit asterisk-config/dialplan-custom/extensions_custom.conf in git instead.
; See asterisk-config/README.md for why this file (and not FreePBX's GUI) is where this lives.

[lamaerp-custom]
; Entry point for outbound ARI-driven voice campaigns (fee reminders, attendance alerts —
; see documentation/05-erp-integration.md). LamaERP.Platform.Telephony's ARI client
; originates a channel directly into this context/extension instead of dialing through
; FreePBX's GUI-managed from-internal context, so campaign traffic never depends on (or
; risks colliding with) anything configured through the admin UI. It hands off immediately
; to the lamaerp-ivr Stasis application, which plays the prompt and captures DTMF — see
; documentation/04-asterisk-apis-ami-ari.md.
exten => campaign-entry,1,NoOp(LamaERP outbound campaign: ${CAMPAIGN_ID})
 same => n,Answer()
 same => n,Stasis(lamaerp-ivr,${CAMPAIGN_ID})
 same => n,Hangup()
