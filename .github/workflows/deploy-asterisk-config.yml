name: Deploy Asterisk custom dialplan

# Deploys ONLY asterisk-config/dialplan-custom/*.conf to the DataHub server's
# /etc/asterisk/*_custom.conf files and reloads the dialplan. Never touches anything
# FreePBX's GUI owns (extensions, trunks, routes) — see asterisk-config/README.md and
# documentation/09-datahub-production-deployment.md.
#
# Prerequisite (one-time, by hand): this repo must already be git-cloned on the server at
# REPO_DIR below, with a deploy key that has read access. This workflow only fetches/resets
# that existing checkout — it does not clone the repo for you.

on:
  push:
    branches: [main]
    paths:
      - 'asterisk-config/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sync dialplan-custom to the DataHub Asterisk server and reload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            REPO_DIR=/opt/lamaerp/asterisk

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: $REPO_DIR is not a git checkout of this repo yet." >&2
              echo "One-time setup: git clone <this-repo-url> $REPO_DIR (with a deploy key)." >&2
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            SRC_DIR="$REPO_DIR/asterisk-config/dialplan-custom"
            DEST_DIR=/etc/asterisk
            BACKUP_DIR="/etc/asterisk/.lamaerp-backup-$(date +%Y%m%d%H%M%S)"
            mkdir -p "$BACKUP_DIR"

            shopt -s nullglob
            for f in "$SRC_DIR"/*.conf; do
              name=$(basename "$f")
              [ -f "$DEST_DIR/$name" ] && cp "$DEST_DIR/$name" "$BACKUP_DIR/$name"
              cp "$f" "$DEST_DIR/$name"
              chown asterisk:asterisk "$DEST_DIR/$name"
            done

            asterisk -rx "dialplan reload"

            if asterisk -rx "dialplan show lamaerp-custom" | grep -qi "No such context"; then
              echo "Smoke test failed (lamaerp-custom context missing) — rolling back" >&2
              for f in "$BACKUP_DIR"/*; do
                [ -f "$f" ] && cp "$f" "$DEST_DIR/$(basename "$f")"
              done
              asterisk -rx "dialplan reload"
              exit 1
            fi

            echo "Deployed and verified lamaerp-custom context."
            rm -rf "$BACKUP_DIR"
